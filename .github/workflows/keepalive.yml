    steps:
      - name: Ping project 1 (marks)
        run: |
          curl -fsS -X POST "https://mmawkcxdaprlbnebajte.supabase.co/rest/v1/rpc/marks_ping" \
            -H "apikey: sb_publishable_aj8bvotHB80CTDcAqJsuZw_RlRyDM3Y" -H "Content-Type: application/json" -d '{}'
      - name: Ping project 2
        run: |
          curl -fsS -X POST "https://ciooldolbkqfluyeaegr.supabase.co/rest/v1/rpc/marks_ping" \
            -H "apikey: sb_publishable_oj8gL4aazyoCRoSMtHvNwA_ZnedV37Z" -H "Content-Type: application/json" -d '{}'
