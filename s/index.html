<div class="wrap">
<header class="hero">
<img src="marks-192.png" alt="">
<h1>ئەنجامی قوتابی</h1>
<p>بۆ بینینی نمرەکانت، کۆدی تایبەت بە خۆت بنووسە</p>

</section>
<div id="out" hidden></div>
</main>
